<div class="p-3 border-bottom bg-body-tertiary">
    <div class="row g-2">
        <div class="col-md-12">
            <input
                type="search"
                class="form-control form-control-sm"
                data-fuzzy-search="lists"
                placeholder="Search..."
                aria-label="Search block lists"
            >
        </div>
    </div>
</div>
<div class="table-responsive">
    <table class="table table-striped mb-0 table-dark">
        <thead>
            <tr>
                <th>List</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for lst in ad_lists %}
            <tr
                data-fuzzy-row="lists"
                data-fuzzy-primary="{{ lst.comment | default('', true) }}"
                data-fuzzy-searchable="{{ lst.comment | default('', true) }} {{ 'enabled' if lst.enabled else 'disabled' }}"
            >
                <td><span class="text-truncate" title="{{ lst.comment }}">{{ lst.comment | default('&nbsp;') }}</span></td>
                <td>
                    <span class="badge {{ 'text-bg-danger' if lst.enabled else 'text-bg-success' }}">
                        {{ 'Blocking' if lst.enabled else 'Not blocking' }}
                    </span>
                </td>
                <td>
                    <form action="{{ url_for('toggle_list') }}" method="POST" class="d-inline tab-aware-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="list_id" value="{{ lst.id }}">
                        <input type="hidden" name="enable" value="{{ 'False' if lst.enabled else 'True' }}">
                        <input type="hidden" name="next_tab" value="lists">
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            {{ 'Stop blocking' if lst.enabled else 'Block from list' }}
                        </button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="text-center py-3">No preloaded lists found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
