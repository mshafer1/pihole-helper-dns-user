    <script>
        function fadeTo(element, toValue = 0, duration = 200) {
            // https://stackoverflow.com/a/68367362/8100990
            // Store our element's current opacity (or default to 1 if null)
            const fromValue = parseFloat(element.style.opacity) || 1;

            // Mark the start time (in ms). We use this to calculate a ratio
            // over time that applied to our supplied duration argument
            const startTime = Date.now();

            // Determines time (ms) between each frame. Sometimes you may not
            // want a full 60 fps for performance reasons or aesthetic 
            const framerate = 1000 / 60; // 60fps

            // Store reference to interval (number) so we can clear it later
            let interval = setInterval(() => {
                const currentTime = Date.now();

                // This creates a normalized number between now vs when we
                // started and how far into our desired duration it goes
                const timeDiff = (currentTime - startTime) / duration;

                // Interpolate our values using the ratio from above
                const value = fromValue - (fromValue - toValue) * timeDiff;

                // If our ratio is >= 1, then we're done.. so stop processing
                if (timeDiff >= 1) {
                    clearInterval(interval);
                    interval = 0;
                    element.style.display = "none";
                }

                // Apply visual. Style attributes are strings.
                element.style.opacity = value.toString();
            }, framerate)
        }

        function removeAlerts() {
            const alerts = document.querySelectorAll(".alert");
            alerts.forEach((alert) => {
                setTimeout(() => {
                    fadeTo(alert, 0, 1000);
                }, 5000);
            });
        }

        window.addEventListener("DOMContentLoaded", removeAlerts);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import Fuse from 'https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.mjs';
        window.Fuse = Fuse;
        window.dispatchEvent(new Event('fuse-ready'));
    </script>
    <script>
        function setUp() {
            const Fuse = window.Fuse;
            const tabIds = ["queries", "domains", "lists"];
            const menuLinks = document.querySelectorAll("[data-tab-target]");
            const tabPanes = document.querySelectorAll(".tab-pane");

            function getHashTab() {
                const candidate = window.location.hash.replace("#", "");
                return tabIds.includes(candidate) ? candidate : "queries";
            }

            function activateTab(tabId) {
                menuLinks.forEach((link) => {
                    const isActive = link.dataset.tabTarget === tabId;
                    link.classList.toggle("active", isActive);
                    link.setAttribute("aria-current", isActive ? "page" : "false");
                    link.setAttribute("aria-selected", String(isActive));
                    link.setAttribute("tabindex", isActive ? "0" : "-1");
                });

                tabPanes.forEach((pane) => {
                    const active = pane.id === tabId;
                    pane.classList.toggle("active", active);
                    pane.classList.toggle("show", active);
                    pane.setAttribute("aria-hidden", String(!active));
                });

                document.querySelectorAll(".tab-aware-form input[name='next_tab']").forEach((input) => {
                    input.value = tabId;
                });
            }

            function syncTabFromHash() {
                const tabId = getHashTab();
                activateTab(tabId);
            }

            menuLinks.forEach((link) => {
                link.addEventListener("click", () => {
                    if (window.innerWidth < 992) {
                        const menu = document.getElementById("mainMenu");
                        if (menu && menu.classList.contains("show")) {
                            new bootstrap.Collapse(menu, { toggle: true });
                        }
                    }
                });
            });

            function setupFuzzySearchForTab(tabId) {
                const rows = Array.from(document.querySelectorAll(`[data-fuzzy-row="${tabId}"]`));
                const searchInput = document.querySelector(`[data-fuzzy-search="${tabId}"]`);

                if (!rows.length || !searchInput) {
                    return;
                }

                const container = rows[0].parentElement;
                if (!container) {
                    return;
                }

                const rowData = rows.map((row, index) => ({
                    id: String(index),
                    index,
                    primary: (row.dataset.fuzzyPrimary || "").trim(),
                    searchable: (row.dataset.fuzzySearchable || "").trim(),
                    row,
                }));

                const fuse = new Fuse(rowData, {
                    includeScore: true,
                    shouldSort: true,
                    ignoreLocation: true,
                    threshold: 0.35,
                    minMatchCharLength: 2,
                    keys: ["primary", "searchable"],
                });

                const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });

                const noResultsRow = document.createElement(container.tagName.toLowerCase() === "ul" ? "li" : "tr");
                noResultsRow.className = container.tagName.toLowerCase() === "ul" ? "list-group-item text-center py-3" : "text-center";

                if (noResultsRow.tagName.toLowerCase() === "tr") {
                    const cell = document.createElement("td");
                    cell.colSpan = 4;
                    cell.className = "text-center py-3";
                    cell.textContent = "No matching results.";
                    noResultsRow.appendChild(cell);
                } else {
                    noResultsRow.textContent = "No matching results.";
                }

                function applyView() {
                    const rawQuery = searchInput.value || "";
                    const query = rawQuery.trim();

                    let visibleRows;

                    if (query) {
                        visibleRows = fuse.search(query).map((result) => ({
                            ...result.item,
                            score: result.score ?? 1,
                        }));
                    } else {
                        visibleRows = rowData.map((item) => ({ ...item, score: 1 }));
                    }

                    if (query) {
                        visibleRows.sort((a, b) => (a.score - b.score) || (a.index - b.index));
                    } else {
                        visibleRows.sort((a, b) => a.index - b.index);
                    }

                    rows.forEach((row) => row.classList.add("d-none"));

                    visibleRows.forEach((item) => {
                        item.row.classList.remove("d-none");
                        container.appendChild(item.row);
                    });

                    noResultsRow.remove();
                    if (!visibleRows.length) {
                        container.appendChild(noResultsRow);
                    }
                }

                searchInput.addEventListener("input", applyView);
                applyView();
            }

            ["queries", "domains", "lists"].forEach(setupFuzzySearchForTab);

            window.addEventListener("hashchange", syncTabFromHash);
            if (!window.location.hash || !tabIds.includes(window.location.hash.replace("#", ""))) {
                window.location.hash = "#queries";
            } else {
                syncTabFromHash();
            }
        }
        window.addEventListener("fuse-ready", setUp);
    </script>
