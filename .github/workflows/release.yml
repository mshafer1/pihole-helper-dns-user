      #   uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
      #   with:
      #     subject-name: ${REGISTRY}/${IMAGE_NAME}
      #     subject-digest: ${{ steps.meta.outputs.digest }}
      #     push-to-registry: true
