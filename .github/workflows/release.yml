#
name: Create and publish a Docker image

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Configures this workflow to run when a GitHub Release is published or manually for testing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish for manual testing
        required: false
        default: manual

# Define the registry to push to as an env var.
env:
  REGISTRY: ghcr.io
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name || 'manual' }}

jobs:
  build-image:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            dockerfile: ./image/Dockerfile
            platforms: linux/amd64
            tag-suffix: amd64
          - name: arm64
            dockerfile: ./image/Dockerfile-arm64v8
            platforms: linux/arm64
            tag-suffix: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-${{ matrix.tag-suffix }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha,format=short

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          tags: |
            ghcr.io/${{ github.repository }}:latest-${{ matrix.tag-suffix }}
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}-${{ matrix.tag-suffix }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ matrix.tag-suffix }}
            ${{ steps.meta.outputs.tags }}
          outputs: type=docker,dest=/tmp/${{ matrix.name }}-image.tar

      - name: Upload image tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-artifact-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}-image.tar
          retention-days: 1  # Short retention since it's just for pipeline sharing

  push-image:
    name: Push Docker images to GitHub Container Registry
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      packages: write # Needed to publish the Docker image to the GitHub Container Registry
      attestations: write # Needed to generate and push an attestation for the Docker image
      id-token: write # Needed to generate an attestation for the Docker image
    steps:
      - name: Download image tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-image-artifact-*
          merge-multiple: true
          path: /tmp/images

      - name: Load Docker images
        run: |
          set -euo pipefail
          shopt -s nullglob
          for image_tar in /tmp/images/*.tar; do
            docker load -i "$image_tar"
          done
          docker image ls --format '{{.Repository}}:{{.Tag}}'

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push architecture-specific tags
        env:
          REMOTE_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" == "manual" ]]; then
            echo "Skipping latest tag for manual release tag"
          else
            docker push "$REMOTE_IMAGE:latest-amd64"
            docker push "$REMOTE_IMAGE:latest-arm64"
          fi
          docker push "$REMOTE_IMAGE:${RELEASE_TAG}-amd64"
          docker push "$REMOTE_IMAGE:${RELEASE_TAG}-arm64"
          docker push "$REMOTE_IMAGE:${GIT_SHA}-amd64"
          docker push "$REMOTE_IMAGE:${GIT_SHA}-arm64"

      - name: Create and push multi-arch manifest
        id: manifest
        env:
          REMOTE_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for ref in latest "$RELEASE_TAG" "$GIT_SHA"; do
            docker manifest create "$REMOTE_IMAGE:$ref" \
              --amend "$REMOTE_IMAGE:${ref}-amd64" \
              --amend "$REMOTE_IMAGE:${ref}-arm64"
            docker manifest push "$REMOTE_IMAGE:$ref"
          done

          digest="$(docker buildx imagetools inspect "$REMOTE_IMAGE:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          echo "release-digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.manifest.outputs.release-digest }}
          push-to-registry: true
