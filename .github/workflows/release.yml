#
name: Create and publish a Docker image

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Configures this workflow to run when a GitHub Release is published.
on:
  release:
    types: [published]

# Define the registry to push to as an env var.
env:
  REGISTRY: ghcr.io

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-image:
    name: Build image and store on pipeline
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=sha,format=short

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./image/Dockerfile
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.tags }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-artifact
          path: /tmp/image.tar
          retention-days: 1  # Short retention since it's just for pipeline sharing

  push-image:
    name: Push Docker image to GitHub Container Registry
    needs: build-image
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      packages: write # Needed to publish the Docker image to the GitHub Container Registry
      attestations: write # Needed to generate and push an attestation for the Docker image
      id-token: write # Needed to generate an attestation for the Docker image
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image-artifact
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/image.tar
          docker images # Optional sanity check to verify loading
      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        id: push
        env:
          REMOTE_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          set -euo pipefail
          docker push --all-tags "$REMOTE_IMAGE" 2>&1 | tee push_output.log
          push_output="$(cat push_output.log)"
          # docker push --all-tags can emit multiple digest lines; keep a single digest for GITHUB_OUTPUT.
          digest="$(printf '%s\n' "$push_output" | grep 'digest: sha256' | cut -d' ' -f3 | head -n 1)"
          if [[ -z "$digest" ]]; then
            echo "Failed to determine pushed image digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
