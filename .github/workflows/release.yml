#
name: Create and publish a Docker image

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:
  push:
    branches: ['releases/*']
  workflow_dispatch:

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  REPO_MAJOR_MINOR: 0.0

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-image:
    name: Build image and store on pipeline
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.meta.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./image/Dockerfile
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-artifact
          path: /tmp/image.tar
          retention-days: 1  # Short retention since it's just for pipeline sharing

  push-image:
    name: Push Docker image to GitHub Container Registry
    needs: build-image
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      packages: write # Needed to publish the Docker image to the GitHub Container Registry
      attestations: write # Needed to generate and push an attestation for the Docker image
      id-token: write # Needed to generate an attestation for the Docker image
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: docker-image-artifact
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/image.tar
          docker images # Optional sanity check to verify loading
      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image to push
        env:
          IMAGE_TAG: ${{ needs.build-image.outputs.image-tag }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.build-image.outputs.image-tag }}
        run: |
          # Tag the locally loaded image for the remote destination
          # docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${REGISTRY_IMAGE}
          docker image ls -a

          # Push to the remote registry
          echo would docker push ${REGISTRY_IMAGE}

