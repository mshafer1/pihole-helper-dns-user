#
name: Create and publish a Docker image

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:
  push:
    branches: ['releases/*']

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.meta.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ github.repository }}
          tags: type=sha,format=short

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./image/Dockerfile
          tags: ${{ github.repository }}:${{ steps.meta.outputs.version }}
          outputs: type=docker,dest=/tmp/${{ github.repository }}-image.tar

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: /tmp/${{ github.repository }}-image.tar
          retention-days: 1  # Short retention since it's just for pipeline sharing

  push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    needs: build-image
      #
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/${{ github.repository }}-image.tar
          docker images # Optional sanity check to verify loading
      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push to Registry
        run: |
          IMAGE_TAG="${{ steps.meta.outputs.version }}"
          REGISTRY_IMAGE="ghcr.io/${{ github.repository_owner }}/${{ github.repository }}:${IMAGE_TAG}"

          # Tag the locally loaded image for the remote destination
          docker tag ${{ github.repository }}:${IMAGE_TAG} ${REGISTRY_IMAGE}

          # Push to the remote registry
          echo would docker push ${REGISTRY_IMAGE}

